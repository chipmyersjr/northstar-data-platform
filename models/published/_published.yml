version: 2

models:
  - name: customer_monthly_metrics
    description: Customer-month metrics rebuilt each run for customers with at least one active resolved workspace and observed usage and costs for every active workspace.
      Missing metrics exclude the entire row; observed zeros remain valid. Usage and costs are observed values, not independently verified complete totals. Revenue
      is an estimate and gross margin is not a GAAP measure. Omitted months are unreportable, not zero.
    columns:
      - name: customer_id
        data_type: VARCHAR
        description: Resolved canonical customer ID; forms the key with reporting_month.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: customer_name
        data_type: VARCHAR
        description: Customer name from the canonical customer dimension.
      - name: reporting_month
        data_type: DATE
        description: First day of the eligible reporting month, including historical months.
        data_tests:
          - not_null
      - name: annualized_subscription_value_usd
        data_type: DECIMAL(18,2)
        description: Month-end annualized contract value in USD from subscription metrics; do not sum across months.
      - name: monthly_subscription_revenue_usd
        data_type: DECIMAL(18,2)
        description: Estimated service-day-prorated revenue in USD from subscription metrics, not recognized accounting revenue.
      - name: product_usage_active_users
        data_type: BIGINT
        description: Observed active users summed across workspaces; a person may be counted more than once.
      - name: product_usage_api_calls
        data_type: BIGINT
        description: Observed API calls summed across the customer's workspaces for the month.
      - name: cloud_cost_usd
        data_type: DECIMAL(18,2)
        description: Observed attributed compute and storage costs in USD from the intermediate model.
      - name: gross_margin
        data_type: DECIMAL(18,4)
        description: Estimated revenue less observed cloud costs, divided by revenue and multiplied by 100. Rounded to four decimal places; NULL for zero revenue.
          Do not sum or directly average percentages.

  - name: monthly_data_quality_exceptions
    description: Explains missing active-workspace observations, resolved usage/cost records outside workspace-active months, and unresolved attribution. Grain is one row per workspace-month
      and missing observation type, one row per excluded usage/cost record, or one row per unresolved contract per active service month.
      Contracts are capped at the source-derived reporting cutoff; usage/cost exceptions may include later months. Contract amounts are
      estimated unattributed monthly revenue; cloud-cost amounts are excluded actual costs. Do not sum the two together. These amounts
      do not total metrics withheld with an entire customer-month. Customer-months with no active workspaces are not represented.
    columns:
      - name: reporting_month
        data_type: DATE
        description: Affected reporting month; contracts use each active service month through the source-derived cutoff.
      - name: source_table
        data_type: VARCHAR
        description: Canonical fact containing the unresolved record or missing observation.
        data_tests:
          - not_null
      - name: issue_category
        data_type: VARCHAR
        description: Mapping for unresolved attribution; completeness for missing observations; lifecycle for resolved records outside workspace-active months.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - mapping
                  - completeness
                  - lifecycle
      - name: issue_reason
        data_type: VARCHAR
        description: Canonical resolution status, missing observation, or pre-creation/post-deletion lifecycle exclusion.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - unresolved_customer
                  - unknown_workspace
                  - missing_workspace
                  - missing_usage
                  - missing_cloud_cost
                  - post_deletion
                  - pre_creation
      - name: workspace_id
        data_type: VARCHAR
        description: Available workspace identifier; NULL when missing from the source.
      - name: customer_id
        data_type: VARCHAR
        description: Known customer for completeness or lifecycle exceptions; NULL for unresolved attribution.
      - name: source_row_id
        data_type: BIGINT
        description: Original source-row reference preserved in the canonical fact; NULL for missing observations.
      - name: excluded_financial_amount_usd
        data_type: DECIMAL(18,2)
        description: Estimated unattributed monthly contract revenue or excluded actual cloud costs from mapping/lifecycle exceptions; do not sum across these source types. Otherwise NULL.
      - name: excluded_active_users
        data_type: BIGINT
        description: Original active-user count for a mapping or lifecycle usage exception; otherwise NULL.
      - name: excluded_api_calls
        data_type: BIGINT
        description: Original API calls for a mapping or lifecycle usage exception; otherwise NULL.

# Unit tests validate transformation logic involving joins, aggregations, and
# calculations using controlled inputs and expected outputs. Simpler models
# rely on data tests to validate their contracts and data integrity.
unit_tests:
  # C1: complete multi-workspace coverage -> published
  # C2: missing usage -> excluded
  # C3: missing cost -> excluded
  # C4: observed zeros -> published with NULL margin
  # C5: no active workspace -> excluded
  - name: customer_months_require_all_workspace_observations
    description: Publishes complete coverage and observed zeros with NULL margin for zero revenue. Excludes partial multi-workspace coverage and customer-months without
      active workspaces, even when intermediate totals exist.
    model: customer_monthly_metrics
    given:
      - input: ref('int_customer_subscription_metrics')
        rows:
          - {customer_id: C1, reporting_month: '2026-04-01', annualized_subscription_value_usd: 1200, monthly_subscription_revenue_usd: 100}
          - {customer_id: C2, reporting_month: '2026-04-01', annualized_subscription_value_usd: 1200, monthly_subscription_revenue_usd: 100}
          - {customer_id: C3, reporting_month: '2026-04-01', annualized_subscription_value_usd: 1200, monthly_subscription_revenue_usd: 100}
          - {customer_id: C4, reporting_month: '2026-04-01', annualized_subscription_value_usd: 0, monthly_subscription_revenue_usd: 0}
          - {customer_id: C5, reporting_month: '2026-04-01', annualized_subscription_value_usd: 1200, monthly_subscription_revenue_usd: 100}
      - input: ref('int_customer_monthly_usage')
        rows:
          - {customer_id: C1, product_usage_active_users: 7, product_usage_api_calls: 70, reporting_month: '2026-04-01'}
          - {customer_id: C2, product_usage_active_users: 7, product_usage_api_calls: 70, reporting_month: '2026-04-01'}
          - {customer_id: C3, product_usage_active_users: 7, product_usage_api_calls: 70, reporting_month: '2026-04-01'}
          - {customer_id: C4, product_usage_active_users: 0, product_usage_api_calls: 0, reporting_month: '2026-04-01'}
          - {customer_id: C5, product_usage_active_users: 7, product_usage_api_calls: 70, reporting_month: '2026-04-01'}
      - input: ref('int_customer_monthly_cloud_costs')
        rows:
          - {customer_id: C1, cloud_cost_usd: 20, reporting_month: '2026-04-01'}
          - {customer_id: C2, cloud_cost_usd: 20, reporting_month: '2026-04-01'}
          - {customer_id: C3, cloud_cost_usd: 20, reporting_month: '2026-04-01'}
          - {customer_id: C4, cloud_cost_usd: 0, reporting_month: '2026-04-01'}
          - {customer_id: C5, cloud_cost_usd: 20, reporting_month: '2026-04-01'}
      - input: ref('dim_customer')
        rows:
          - {customer_id: C1, customer_name: Customer 1}
          - {customer_id: C2, customer_name: Customer 2}
          - {customer_id: C3, customer_name: Customer 3}
          - {customer_id: C4, customer_name: Customer 4}
          - {customer_id: C5, customer_name: Customer 5}
      - input: ref('int_workspace_month_coverage')
        rows:
          - {customer_id: C1, reporting_month: '2026-04-01', workspace_id: W1, has_usage: true, has_cost: true}
          - {customer_id: C1, reporting_month: '2026-04-01', workspace_id: W2, has_usage: true, has_cost: true}
          - {customer_id: C2, reporting_month: '2026-04-01', workspace_id: W3, has_usage: true, has_cost: true}
          - {customer_id: C2, reporting_month: '2026-04-01', workspace_id: W4, has_usage: false, has_cost: true}
          - {customer_id: C3, reporting_month: '2026-04-01', workspace_id: W5, has_usage: true, has_cost: true}
          - {customer_id: C3, reporting_month: '2026-04-01', workspace_id: W6, has_usage: true, has_cost: false}
          - {customer_id: C4, reporting_month: '2026-04-01', workspace_id: W7, has_usage: true, has_cost: true}
    expect:
      rows:
        - {customer_id: C1, customer_name: Customer 1, reporting_month: '2026-04-01', annualized_subscription_value_usd: 1200, monthly_subscription_revenue_usd: 100,
          product_usage_active_users: 7, product_usage_api_calls: 70, cloud_cost_usd: 20, gross_margin: 80}
        - {customer_id: C4, customer_name: Customer 4, reporting_month: '2026-04-01', annualized_subscription_value_usd: 0, monthly_subscription_revenue_usd: 0, product_usage_active_users: 0,
          product_usage_api_calls: 0, cloud_cost_usd: 0, gross_margin: null}

  - name: exceptions_explain_missing_observations_and_unresolved_records
    description: Reports missing usage and costs separately, skips observed zeros and resolved records, and preserves unresolved reasons, source rows, months, and excluded
      metrics. Resolved pre-creation/post-deletion records retain their amounts; unresolved records stay mapping exceptions. Contract revenue covers partial months, inclusive end dates, half-cent rounding, and the source-derived cutoff.
    model: monthly_data_quality_exceptions
    given:
      - input: ref('int_workspace_month_coverage')
        rows:
          - {customer_id: C1, reporting_month: '2026-04-01', workspace_id: W1, has_usage: false, has_cost: false}
          - {customer_id: C1, reporting_month: '2026-04-01', workspace_id: W2, has_usage: true, has_cost: false}
          - {customer_id: C1, reporting_month: '2026-04-01', workspace_id: W3, has_usage: true, has_cost: true}
      - input: ref('fct_workspace_usage')
        rows:
          - {customer_id: null, workspace_id: W7, usage_month: '2026-04-01', resolution_status: unresolved_customer, lifecycle_status: post_deletion, active_users: 2, api_calls: 20, source_row_id: 1}
          - {customer_id: null, workspace_id: W999, usage_month: '2026-05-01', resolution_status: unknown_workspace, lifecycle_status: unknown, active_users: 3, api_calls: 30, source_row_id: 2}
          - {customer_id: C1, workspace_id: W3, usage_month: '2026-04-01', resolution_status: resolved, lifecycle_status: active, active_users: 0, api_calls: 0, source_row_id: 3}
          - {customer_id: C1, workspace_id: W4, usage_month: '2026-04-01', resolution_status: resolved, lifecycle_status: post_deletion, active_users: 9, api_calls: 90, source_row_id: 10}
          - {customer_id: C1, workspace_id: W5, usage_month: '2026-04-01', resolution_status: resolved, lifecycle_status: pre_creation, active_users: 8, api_calls: 80, source_row_id: 11}
      - input: ref('fct_workspace_cloud_costs')
        rows:
          - {customer_id: null, workspace_id: null, usage_month: '2026-04-01', resolution_status: missing_workspace, lifecycle_status: unknown, compute_cost_usd: 10, storage_cost_usd: 2, source_row_id: 4}
          - {customer_id: null, workspace_id: W7, usage_month: '2026-04-01', resolution_status: unresolved_customer, lifecycle_status: post_deletion, compute_cost_usd: 3, storage_cost_usd: 1, source_row_id: 5}
          - {customer_id: C1, workspace_id: W3, usage_month: '2026-04-01', resolution_status: resolved, lifecycle_status: active, compute_cost_usd: 0, storage_cost_usd: 0, source_row_id: 6}
          - {customer_id: C1, workspace_id: W4, usage_month: '2026-04-01', resolution_status: resolved, lifecycle_status: post_deletion, compute_cost_usd: 9, storage_cost_usd: 1, source_row_id: 12}
          - {customer_id: C1, workspace_id: W5, usage_month: '2026-04-01', resolution_status: resolved, lifecycle_status: pre_creation, compute_cost_usd: 8, storage_cost_usd: 2, source_row_id: 13}
      - input: ref('fct_contracts')
        rows:
          - {contract_id: K7, customer_id: null, resolution_status: unresolved_customer, starts_on: '2026-02-15', ends_on: '2026-04-01', recurring_amount_usd: 1200, billing_period: annual, source_row_id: 7}
          - {contract_id: K8, customer_id: null, resolution_status: unresolved_customer, starts_on: '2026-02-01', ends_on: '2026-02-01', recurring_amount_usd: 14.98, billing_period: monthly, source_row_id: 8}
          - {contract_id: K9, customer_id: null, resolution_status: unresolved_customer, starts_on: '2026-04-30', ends_on: null, recurring_amount_usd: 30.15, billing_period: monthly, source_row_id: 9}
      # February contract exceptions are retained even though the spine starts in March.
      # The spine supplies the reporting cutoff, not the set of eligible contract months.
      - input: ref('int_customer_month_spine')
        rows:
          - {customer_id: C1, reporting_month: '2026-03-01'}
          - {customer_id: C1, reporting_month: '2026-04-01'}
    expect:
      rows:
        - {reporting_month: '2026-04-01', source_table: canonical.fct_workspace_usage, issue_category: completeness, issue_reason: missing_usage, workspace_id: W1,
          customer_id: C1, source_row_id: null, excluded_financial_amount_usd: null, excluded_active_users: null, excluded_api_calls: null}
        - {reporting_month: '2026-04-01', source_table: canonical.fct_workspace_cloud_costs, issue_category: completeness, issue_reason: missing_cloud_cost, workspace_id: W1,
          customer_id: C1, source_row_id: null, excluded_financial_amount_usd: null, excluded_active_users: null, excluded_api_calls: null}
        - {reporting_month: '2026-04-01', source_table: canonical.fct_workspace_cloud_costs, issue_category: completeness, issue_reason: missing_cloud_cost, workspace_id: W2,
          customer_id: C1, source_row_id: null, excluded_financial_amount_usd: null, excluded_active_users: null, excluded_api_calls: null}
        - {reporting_month: '2026-04-01', source_table: canonical.fct_workspace_usage, issue_category: mapping, issue_reason: unresolved_customer, workspace_id: W7,
          customer_id: null, source_row_id: 1, excluded_financial_amount_usd: null, excluded_active_users: 2, excluded_api_calls: 20}
        - {reporting_month: '2026-05-01', source_table: canonical.fct_workspace_usage, issue_category: mapping, issue_reason: unknown_workspace, workspace_id: W999,
          customer_id: null, source_row_id: 2, excluded_financial_amount_usd: null, excluded_active_users: 3, excluded_api_calls: 30}
        - {reporting_month: '2026-04-01', source_table: canonical.fct_workspace_cloud_costs, issue_category: mapping, issue_reason: missing_workspace, workspace_id: null,
          customer_id: null, source_row_id: 4, excluded_financial_amount_usd: 12, excluded_active_users: null, excluded_api_calls: null}
        - {reporting_month: '2026-04-01', source_table: canonical.fct_workspace_cloud_costs, issue_category: mapping, issue_reason: unresolved_customer, workspace_id: W7,
          customer_id: null, source_row_id: 5, excluded_financial_amount_usd: 4, excluded_active_users: null, excluded_api_calls: null}
        - {reporting_month: '2026-02-01', source_table: canonical.fct_contracts, issue_category: mapping, issue_reason: unresolved_customer, workspace_id: null,
          customer_id: null, source_row_id: 7, excluded_financial_amount_usd: 50.00, excluded_active_users: null, excluded_api_calls: null}
        - {reporting_month: '2026-03-01', source_table: canonical.fct_contracts, issue_category: mapping, issue_reason: unresolved_customer, workspace_id: null,
          customer_id: null, source_row_id: 7, excluded_financial_amount_usd: 100.00, excluded_active_users: null, excluded_api_calls: null}
        - {reporting_month: '2026-04-01', source_table: canonical.fct_contracts, issue_category: mapping, issue_reason: unresolved_customer, workspace_id: null,
          customer_id: null, source_row_id: 7, excluded_financial_amount_usd: 3.33, excluded_active_users: null, excluded_api_calls: null}
        - {reporting_month: '2026-02-01', source_table: canonical.fct_contracts, issue_category: mapping, issue_reason: unresolved_customer, workspace_id: null,
          customer_id: null, source_row_id: 8, excluded_financial_amount_usd: 0.54, excluded_active_users: null, excluded_api_calls: null}
        - {reporting_month: '2026-04-01', source_table: canonical.fct_contracts, issue_category: mapping, issue_reason: unresolved_customer, workspace_id: null,
          customer_id: null, source_row_id: 9, excluded_financial_amount_usd: 1.01, excluded_active_users: null, excluded_api_calls: null}
        - {reporting_month: '2026-04-01', source_table: canonical.fct_workspace_usage, issue_category: lifecycle, issue_reason: post_deletion, workspace_id: W4,
          customer_id: C1, source_row_id: 10, excluded_financial_amount_usd: null, excluded_active_users: 9, excluded_api_calls: 90}
        - {reporting_month: '2026-04-01', source_table: canonical.fct_workspace_usage, issue_category: lifecycle, issue_reason: pre_creation, workspace_id: W5,
          customer_id: C1, source_row_id: 11, excluded_financial_amount_usd: null, excluded_active_users: 8, excluded_api_calls: 80}
        - {reporting_month: '2026-04-01', source_table: canonical.fct_workspace_cloud_costs, issue_category: lifecycle, issue_reason: post_deletion, workspace_id: W4,
          customer_id: C1, source_row_id: 12, excluded_financial_amount_usd: 10, excluded_active_users: null, excluded_api_calls: null}
        - {reporting_month: '2026-04-01', source_table: canonical.fct_workspace_cloud_costs, issue_category: lifecycle, issue_reason: pre_creation, workspace_id: W5,
          customer_id: C1, source_row_id: 13, excluded_financial_amount_usd: 10, excluded_active_users: null, excluded_api_calls: null}
